server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo existente cai no index.html,
    # deixando o react-router-dom (BrowserRouter) cuidar da navegação
    location / {
        try_files $uri $uri/ /index.html;
    }
}
